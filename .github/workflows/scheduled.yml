name: Claude Scheduled

# On days with notes it does nothing; only on days without them does it build a topic of the day.
# What a human recorded in the field always wins — the agent only fills the blanks.

on:
  schedule:
    - cron: "0 21 * * *"   # 06:00 KST daily — topic of the day, if nothing was recorded
    - cron: "0 22 * * 6"   # Sunday 07:00 KST (Sat 22:00 UTC) — weekly review
    - cron: "0 23 1 * *"   # 2nd at 08:00 KST (1st 23:00 UTC) — standardize
  workflow_dispatch:
    inputs:
      skill:
        description: Skill to run (auto = follow the schedule rules)
        required: false
        default: auto
        type: choice
        options: [auto, daily-topic, weekly-review, standardize]
      force:
        description: Generate a topic of the day even if notes exist
        required: false
        default: false
        type: boolean

concurrency:
  group: vault-write
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide which skill to run
        id: pick
        env:
          DISPATCH_SKILL: ${{ inputs.skill }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          skill=""
          case "${{ github.event.schedule }}" in
            "0 22 * * 6") skill=weekly-review ;;
            "0 23 1 * *") skill=standardize ;;
            "0 21 * * *") skill=daily-topic ;;
          esac

          # A manual run with an explicit skill wins.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${DISPATCH_SKILL:-auto}" != "auto" ]; then
            skill="$DISPATCH_SKILL"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            skill=daily-topic
          fi

          if [ -z "$skill" ]; then
            echo "No schedule matched." >&2
            exit 1
          fi

          # The topic of the day runs only when a human recorded nothing that day.
          # Test: hands-on docs changed in the last 26 hours that the agent did not write.
          # (26h = 24h plus runner slack. Skill output is filtered out by its `source`.)
          if [ "$skill" = "daily-topic" ] && [ "${FORCE:-false}" != "true" ]; then
            captured=0
            changed_files=$(git log --since="26 hours ago" --name-only --pretty=format: \
              -- 00-inbox 01-install 02-runbook 03-troubleshoot 04-reference \
              | grep -E '\.md$' | sort -u || true)

            for f in $changed_files; do
              [ -f "$f" ] || continue                      # deleted or moved files do not count
              src=$(sed -n 's/^source:[[:space:]]*//p' "$f" | head -1)
              case "$src" in
                daily-topic|weekly-review|standardize) ;;   # agent output is not a note
                *) captured=$((captured + 1)); echo "  human note: $f (source=${src:-none})" ;;
              esac
            done

            if [ "$captured" -gt 0 ]; then
              echo "${captured} hands-on note(s) in the last 26 hours. Skipping the topic of the day."
              echo "skill=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "No recent notes — generating a topic of the day."
          fi

          echo "skill=$skill" >> "$GITHUB_OUTPUT"
          echo "scheduled run: $skill"

      - name: Run Claude
        if: steps.pick.outputs.skill != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Runs on the runner token, without installing the official Claude GitHub App.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            This repository keeps DevOps hands-on experience as markdown.
            Read CLAUDE.md first and follow its folder and frontmatter conventions exactly.

            Read .claude/skills/${{ steps.pick.outputs.skill }}/SKILL.md and carry out that procedure precisely.
            This is a scheduled run, so there is no user input. The existing documents are the only input.

            Constraints:
            - Write only inside the document folders (00-inbox through 06-archive). Do not touch .github/, scripts/, or site/.
            - Do not delete files. Retired things move to 06-archive/.
            - Do not commit or push. Leave the files; the next step handles it.
            - If today's output already exists, update that file instead of creating a new one.
            - Never present a command you did not run as verified. `verified` takes only a real verification date.
            - Write every document in English.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,TodoWrite

      - name: Commit changes
        id: commit
        if: steps.pick.outputs.skill != ''
        env:
          SKILL: ${{ steps.pick.outputs.skill }}
        run: |
          set -euo pipefail
          git config user.name  "handson-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Revert framework files if they changed (the guard against a prompt violation).
          git checkout -- .github scripts site package.json package-lock.json site.config.json CLAUDE.md 2>/dev/null || true

          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing changed — skipping the commit."
            exit 0
          fi
          git add -A
          git commit -m "$SKILL: scheduled run $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: run
    if: needs.run.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: main
