name: Build & Deploy Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "SETUP.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:
  # The agent workflows call this directly after committing.
  # A push made with GITHUB_TOKEN cannot trigger another workflow (recursion guard),
  # so this is exposed as a reusable workflow and the caller continues the deploy.
  workflow_call:
    inputs:
      ref:
        description: Ref to build. The agent workflows pass main so they pick up the commit they just pushed.
        type: string
        default: main

# No concurrent deploys. Let a running one finish; only replace what is queued.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # On workflow_call the default ref is the SHA that triggered the calling workflow.
      # The agent commits after that, so leaving it would deploy a site one commit behind.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the site from the repository markdown
        run: node scripts/build.mjs

      # site/CNAME is copied into dist/ so the custom domain (handson.metacog.co.kr) survives.
      - name: Check the custom domain file
        run: test -f dist/CNAME && cat dist/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
