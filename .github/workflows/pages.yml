name: Build & Deploy Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "SETUP.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:
  # 에이전트 워크플로가 커밋 후 직접 호출합니다.
  # GITHUB_TOKEN으로 만든 push는 다른 워크플로를 트리거하지 못하므로(재귀 방지),
  # 재사용 워크플로로 노출해 두고 호출하는 쪽에서 배포를 이어갑니다.
  workflow_call:
    inputs:
      ref:
        description: 빌드할 ref. 에이전트 워크플로는 자기가 방금 푸시한 커밋을 받기 위해 main을 넘깁니다.
        type: string
        default: main

# 동시 배포 방지. 진행 중인 배포는 끝내고, 대기 중인 것만 교체.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # workflow_call로 불릴 때 기본 ref는 "호출한 워크플로를 트리거한 SHA" 입니다.
      # 에이전트가 그 뒤에 커밋을 얹으므로, 그대로 두면 한 커밋 뒤처진 사이트가 배포됩니다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 저장소의 마크다운으로 사이트 빌드
        run: node scripts/build.mjs

      # site/CNAME 이 dist/ 로 복사되어 커스텀 도메인(handson.metacog.co.kr)을 유지합니다.
      - name: 커스텀 도메인 파일 확인
        run: test -f dist/CNAME && cat dist/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
