name: 📅 Topic of the day
description: Build a 30-minute lab from one current DevOps topic right now. (Also runs automatically on mornings with no notes.)
title: "Topic of the day"
labels: ["daily-topic"]
body:
  - type: markdown
    attributes:
      value: |
        The topic is picked from the scope in `04-reference/topics.md`. The rules are **sources required · lab finishes locally · no repeats within 30 days**.
        Edit that file to change what gets covered.

  - type: textarea
    id: focus
    attributes:
      label: Anything specific for today (optional)
      description: Leave it empty and it picks from the whole declared scope.
      placeholder: pick something around Terraform state operations today

  - type: checkboxes
    id: ack
    attributes:
      label: Acknowledge
      options:
        - label: I will verify any lab step the agent could not run itself.
          required: true
