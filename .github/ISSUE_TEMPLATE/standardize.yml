name: 📐 Standardize a procedure
description: Promote the same work scattered across documents into one standard runbook.
title: "Standardize a procedure"
labels: ["standardize"]
body:
  - type: markdown
    attributes:
      value: |
        Existing documents are the only input. No new facts get invented.
        The synthesized runbook comes out with `verified` **empty** — run it for real once, then fill it in yourself.

  - type: input
    id: target
    attributes:
      label: Work to standardize (optional)
      description: Leave it empty and the agent picks whatever recurred most.
      placeholder: the node replacement records

  - type: checkboxes
    id: ack
    attributes:
      label: Acknowledge
      options:
        - label: I will not use a synthesized runbook on real work until it has been verified.
          required: true
