name: 🔁 Weekly review
description: Cross-read the last 7 days for repeated failures and missing procedures. (Also runs automatically on Sunday mornings.)
title: "Weekly review"
labels: ["weekly-review"]
body:
  - type: markdown
    attributes:
      value: |
        This skill **does not edit documents.** It observes and leaves a review in `05-daily/`.
        If the result calls for procedure work, request `Standardize` separately.

  - type: textarea
    id: focus
    attributes:
      label: Anything to look at specifically (optional)
      placeholder: deploys failed a lot this week — check whether there is a common cause
