name: 🛠 Field notes
description: Throw in the install, task, or incident you just finished — it gets sorted into the right category.
title: "Field notes"
labels: ["handson"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not tidy it up.** Shell history, error messages, and the order you went down the wrong path — tangled is correct.
        Whether it becomes an install guide, a runbook, or a troubleshooting guide is the agent's call.

        ⚠️ **Do not paste tokens, passwords, or private keys.** This repository is public, and even though the agent
        masks them in the document, the issue body itself stays exactly as written.

  - type: textarea
    id: dump
    attributes:
      label: What happened
      description: It does not need to be in sentences. Pasting the commands you ran and the errors you got works best.
      placeholder: |
        put argocd on the eks 1.31 cluster, login kept redirect-looping
        installed with helm, ingress-nginx was already there
        ended up adding --insecure to server.extraArgs and it worked
        cli needed --grpc-web separately on top of that
        next time prepare the values file up front
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Verified environment (optional)
      description: With versions, it goes straight into the document. Leave it empty and the agent infers it from the body, or leaves it blank.
      placeholder: Kubernetes 1.31 (EKS) · Helm 3.16 · ingress-nginx 1.11

  - type: dropdown
    id: kind
    attributes:
      label: Category hint (optional)
      description: Pick one if you are sure. Leave it and the agent classifies.
      options:
        - Auto-classify
        - Install guide
        - Runbook
        - Troubleshooting guide
      default: 0
